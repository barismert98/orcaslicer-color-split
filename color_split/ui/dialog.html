<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html><head><meta charset="utf-8"><style>
/* Same look as the Color Split tab; colors follow OrcaSlicer's theme. */
:root{--accent:var(--orca-accent,#00897b);--accent-fg:var(--orca-accent-fg,#fff);--line:var(--orca-border,rgba(128,128,128,.35));--fill:rgba(128,128,128,.10);--fill-strong:rgba(128,128,128,.18)}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--orca-bg,transparent);color:var(--orca-fg,inherit);font:13px/1.45 var(--orca-font,"Segoe UI",system-ui,sans-serif)}
.rows{border:1px solid var(--line);border-radius:6px}
.row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>label,.row>.name{font-weight:500}
.help{grid-column:2;font-size:12px;opacity:.62;margin-top:-4px}
select,input[type=number]{width:100%;height:28px;padding:0 8px;font:inherit;color:inherit;background:var(--fill);border:1px solid var(--line);border-radius:4px}
input:disabled{opacity:.45}
option{color:var(--orca-fg,#222);background:var(--orca-bg,#fff)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:4px 12px;cursor:pointer;border-left:1px solid var(--line);user-select:none}
.seg label:first-of-type{border-left:0}
.seg input:checked+label{background:var(--accent);color:var(--accent-fg)}
.unit{position:relative;max-width:120px}.unit input{padding-right:30px}
.unit span{position:absolute;right:8px;top:5px;opacity:.62;pointer-events:none}
.switch{position:relative;width:34px;height:18px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;z-index:1}
.switch span{position:absolute;inset:0;border-radius:9px;background:var(--fill-strong)}
.switch span::after{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;border-radius:50%;background:#fff}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.toggle{display:flex;align-items:center;gap:10px}
.actions{display:flex;align-items:center;gap:10px;margin-top:14px}
button{height:30px;padding:0 22px;border:0;border-radius:4px;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
#msg{color:#e05252;font-size:12px}
</style></head><body>
<div class="rows">
 <div class="row"><label for="obj">Object</label><select id="obj"></select></div>
 <div class="row"><span class="name">Surface paint</span>
  <div class="seg" role="radiogroup" aria-label="Surface paint">
   <input type="radio" name="surface" id="s-paint" value="paint" checked><label for="s-paint">Cut</label>
   <input type="radio" name="surface" id="s-raise" value="raise"><label for="s-raise">Raise</label>
   <input type="radio" name="surface" id="s-inlay" value="inlay"><label for="s-inlay">Inlay</label></div></div>
 <div class="row"><label for="thick">Thickness</label>
  <div class="unit"><input id="thick" type="number" step="0.1" min="0.2" max="5" value="0.6" disabled><span>mm</span></div></div>
 <div class="row"><span class="name">Buried parts</span>
  <div class="toggle"><span class="switch"><input type="checkbox" id="joints"><span></span></span><span>Take out whole</span></div>
  <div class="help">A ball sunk past its middle comes out whole; the base is cut through it.</div></div>
</div>
<div class="actions"><button id="go" disabled>Split</button><span id="msg"></span></div>
<script>
const $ = id => document.getElementById(id);
const mode = () => document.querySelector('input[name="surface"]:checked').value;
document.querySelectorAll('input[name="surface"]').forEach(r =>
  r.addEventListener("change", () => { $("thick").disabled = mode() === "paint"; }));
window.orca.onMessage(m => {
  if (!m || m.type !== "init") return;
  $("obj").innerHTML = "";
  for (const o of m.objects) {
    const opt = document.createElement("option");
    opt.value = o.index; opt.textContent = o.name; $("obj").appendChild(opt);
  }
  $("go").disabled = !m.objects.length;
});
$("go").onclick = () => {
  const thick = parseFloat($("thick").value);
  if (mode() !== "paint" && !(thick >= 0.2 && thick <= 5)) { $("msg").textContent = "Thickness must be 0.2 to 5 mm."; return; }
  window.orca.submit({index: parseInt($("obj").value, 10), split_joints: $("joints").checked,
                      surface_mode: mode(), surface_thickness: mode() === "paint" ? 0.6 : thick});
};
window.addEventListener("DOMContentLoaded", () => window.orca.postMessage({type: "ready"}));
</script></body></html>
