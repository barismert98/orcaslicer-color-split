[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Color-Split"
version = "1.3.0"
description = "Color Split: turn a colour-painted OrcaSlicer model into separate printable parts, one per colour"
readme = "docs/PLUGIN.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "manifold3d", "scipy"]

[tool.setuptools]
packages = ["color_split", "color_split.ui"]

[tool.setuptools.package-data]
"color_split.ui" = ["*.html", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
